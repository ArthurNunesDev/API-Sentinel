name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hack-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run health payload tests with HHVM
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hhvm/hhvm:latest \
            hhvm tests/HealthTest.php

      - name: Build web runtime image
        run: docker build -t api-sentinel .
